# Confirmed: self-service ArgoCD access -- you register this Application
# yourself (no admin hand-off needed for this step). Still needs
# NAMESPACE_PLACEHOLDER (below) replaced with your actual Azimuth namespace
# before applying it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexus-risk-dashboard
  namespace: argocd
spec:
  project: default
  source:
    # TODO: update to the Enterprise repo URL ArgoCD should actually pull from.
    repoURL: https://github.com/azu-business/risk-dashboards.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    # TODO: replace with your actual Azimuth namespace.
    namespace: NAMESPACE_PLACEHOLDER
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
