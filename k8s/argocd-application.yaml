# Confirmed working -- this Application was successfully created in ArgoCD
# (project: enterprise-risk-reporting, same value used for the namespace).
# It's currently Missing/OutOfSync while the container image and other
# placeholders below still need resolving.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexus-risk-dashboard
  namespace: argocd
spec:
  project: enterprise-risk-reporting
  source:
    repoURL: https://github.com/azu-business/risk-dashboards.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: enterprise-risk-reporting
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
