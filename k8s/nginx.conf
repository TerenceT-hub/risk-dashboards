# Listens on 8080 (not 80) since many hardened Kubernetes clusters block
# containers from binding privileged ports / running as root.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every page here is a real, separate .html file (not a client-side-routed
    # SPA), so no catch-all rewrite is needed -- a direct request for e.g.
    # /risk-matrix.html should just serve that file.
    location / {
        try_files $uri $uri/ =404;
    }

    # data/*.json changes on every auto-refresh cycle; don't let browsers or
    # intermediate caches serve a stale copy.
    location /data/ {
        add_header Cache-Control "no-cache";
    }
}
