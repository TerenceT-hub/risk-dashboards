apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-risk-dashboard
  labels:
    app: nexus-risk-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-risk-dashboard
  template:
    metadata:
      labels:
        app: nexus-risk-dashboard
    spec:
      containers:
        - name: nexus-risk-dashboard
          # TODO: replace with the actual Harbor (or other registry) path once
          # confirmed -- e.g. harbor.azimuth.<astrazeneca-domain>/<project>/nexus-risk-dashboard:<tag>
          image: REGISTRY_PLACEHOLDER/nexus-risk-dashboard:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            # Matches the Kubernetes "restricted" Pod Security Standard --
            # several admission/policy engines (Azimuth's stack includes
            # Kyverno) reject pods outright if these aren't set, which can
            # surface in ArgoCD as the resource simply never appearing in
            # the cluster rather than a clearer pod-level error.
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
